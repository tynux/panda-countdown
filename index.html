<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panda Countdown</title>
<style>
  :root { --paper:#FFF9EC; --card:#fff; --ink:#3E2C1C; --soft:#7A6552; --line:#E7D9C0; --mustard:#F5B325; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
  .wrap { max-width:680px; margin:0 auto; padding:64px 22px; text-align:center; }
  .panda { font-size:84px; line-height:1 }
  h1 { font-size:34px; margin:10px 0 4px; }
  .sub { color:var(--soft); font-style:italic; }
  p { color:var(--ink); }
  .links { display:flex; gap:12px; justify-content:center; margin-top:26px; flex-wrap:wrap }
  .links a { background:var(--mustard); color:var(--ink); text-decoration:none; font-weight:700;
             padding:13px 22px; border-radius:15px; }
  .note { color:var(--soft); font-size:13.5px; margin-top:30px }
</style>
</head>
<body>
<div class="wrap">
  <div class="panda">🐼</div>
  <h1>Panda Countdown</h1>
  <p class="sub">the cutest ever countdown app</p>
  <p>A cosy, hand-drawn panda keeps an eye on every date that matters — with Home Screen and Lock&nbsp;Screen widgets, notes, reminders, a wish list and two-way counting. Available in English, 简体中文 and 繁體中文.</p>
  <div class="links">
    <a href="support.html">Support</a>
    <a href="privacy.html">Privacy Policy</a>
  </div>
  <p class="note">Contact: <a href="mailto:peill@me.com">peill@me.com</a></p>
</div>
</body>
</html>
